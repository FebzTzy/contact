
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <title>Social Hub</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    :root {
      --bg: #080b14;
      --panel: rgba(20, 25, 43, 0.78);
      --text: #f8fafc;
      --muted: #8c96ae;
      --blue: #38bdf8;
      --purple: #8b5cf6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 10% 10%, #172554 0, transparent 42%),
        radial-gradient(ellipse at 90% 90%, #3b0764 0, transparent 38%),
        var(--bg);
    }

    .glow {
      position: fixed;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.22;
      pointer-events: none;
    }

    .glow.one {
      background: #0ea5e9;
      top: 5%;
      left: -90px;
    }

    .glow.two {
      background: #9333ea;
      bottom: 0;
      right: -80px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      position: relative;
      padding: 40px 32px 32px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      background: var(--panel);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
      animation: appear 0.65s ease both;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .profile {
      text-align: center;
      margin-bottom: 38px;
    }

    /* LOGO AVATAR */
    .avatar {
      width: 114px;
      height: 114px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 32px;
      background: linear-gradient(135deg, #38bdf8, #7c3aed);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.23);
      transform: rotate(-3deg);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: inherit;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
      margin-top: 12px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 20px;
      padding: 10px 15px;
      border: 1px solid rgba(74, 222, 128, 0.18);
      background: rgba(34, 197, 94, 0.08);
      border-radius: 30px;
      color: #86efac;
      font-size: 13px;
      font-weight: 700;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 9px #4ade80;
    }

    .section-label {
      margin: 0 0 16px 3px;
      color: #98a4bc;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .menu {
      display: grid;
      gap: 14px;
    }

    .social {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      min-height: 90px;
      padding: 17px;
      text-decoration: none;
      color: white;
      text-align: left;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.035);
      cursor: pointer;
      transition: transform 0.25s ease,
                  border-color 0.25s ease,
                  background 0.25s ease;
      font: inherit;
    }

    .social:hover {
      transform: translateY(-3px);
      border-color: rgba(56, 189, 248, 0.5);
      background: rgba(255, 255, 255, 0.07);
    }

    .social:active {
      transform: scale(0.98);
    }

    .social-icon {
      width: 58px;
      height: 58px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 18px;
      font-size: 28px;
      color: white;
    }

    .tg-icon {
      background: linear-gradient(135deg, #38bdf8, #2563eb);
    }

    .ig-icon {
      background: linear-gradient(
        135deg,
        #fbbf24,
        #ec4899,
        #8b5cf6
      );
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .info strong {
      display: block;
      font-size: 17px;
      font-weight: 700;
    }

    .info small {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .arrow {
      color: #7c8ba7;
      font-size: 25px;
      padding-right: 3px;
    }

    .hidden {
      display: none !important;
    }

    .back {
      margin-top: 16px;
      width: 100%;
      padding: 15px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 15px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.04);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .back:hover {
      background: rgba(255, 255, 255, 0.09);
    }

    .footer {
      text-align: center;
      color: #69758e;
      font-size: 11px;
      margin-top: 32px;
      letter-spacing: 1px;
    }

    .footer span {
      color: #a78bfa;
    }

    @media (max-width: 480px) {
      body {
        padding: 18px;
      }

      .container {
        padding: 30px 20px 25px;
        border-radius: 28px;
      }

      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 29px;
      }

      h1 {
        font-size: 28px;
      }

      .subtitle {
        font-size: 14px;
      }

      .social {
        min-height: 80px;
        padding: 13px;
        border-radius: 18px;
      }

      .social-icon {
        width: 50px;
        height: 50px;
        border-radius: 15px;
        font-size: 24px;
      }

      .info strong {
        font-size: 15px;
      }

      .info small {
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="container">

    <header class="profile">
      <div class="avatar">
        <img
          src="https://files.catbox.moe/jcu258.png"
          alt="Logo Social Hub"
          onerror="this.style.display='none'; this.parentElement.classList.add('logo-error');"
        >
      </div>

      <h1>CONTACT ME</h1>

      <div class="subtitle">
        Temukan dan hubungi saya<br>
        melalui media sosial berikut.
      </div>

      <div class="status">
        <span class="dot"></span>
        SOCIAL LINKS
      </div>
    </header>

    <!-- MENU UTAMA -->
    <section id="mainMenu">
      <div class="section-label">CONNECT WITH ME</div>

      <div class="menu">

        <button
          type="button"
          class="social"
          onclick="showTelegram()"
        >
          <span class="social-icon tg-icon">✈</span>

          <span class="info">
            <strong>Telegram</strong>
            <small>Akun &amp; channel Telegram</small>
          </span>

          <span class="arrow">›</span>
        </button>

        <a
          class="social"
          href="https://www.instagram.com/stevenjhonn_/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="social-icon ig-icon">◎</span>

          <span class="info">
            <strong>Instagram</strong>
            <small>Follow my Instagram</small>
          </span>

          <span class="arrow">↗</span>
        </a>

      </div>
    </section>

    <!-- MENU TELEGRAM -->
    <section id="telegramMenu" class="hidden">
      <div class="section-label">TELEGRAM OPTIONS</div>

      <div class="menu">

        <a
          class="social"
          href="https://t.me/policee_55"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="social-icon tg-icon">👤</span>

          <span class="info">
            <strong>Akun Telegram</strong>
            <small>Chat langsung dengan saya</small>
          </span>

          <span class="arrow">↗</span>
        </a>

        <a
          class="social"
          href="https://t.me/moria4k"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="social-icon tg-icon">📢</span>

          <span class="info">
            <strong>Channel Telegram</strong>
            <small>Gabung untuk mendapatkan update</small>
          </span>

          <span class="arrow">↗</span>
        </a>

      </div>

      <button
        type="button"
        class="back"
        onclick="showMain()"
      >
        ← Kembali ke menu utama
      </button>
    </section>

    <footer class="footer">
      <span>©</span>Copyright · FebzTzy
    </footer>

  </main>

  <script>
    function showTelegram() {
      document.getElementById('mainMenu').classList.add('hidden');
      document.getElementById('telegramMenu').classList.remove('hidden');
    }

    function showMain() {
      document.getElementById('telegramMenu').classList.add('hidden');
      document.getElementById('mainMenu').classList.remove('hidden');
    }
  </script>
</body>
</html>
